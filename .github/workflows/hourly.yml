name: Find studios

on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour: GitHub drops or delays scheduled runs, so this keeps roughly hourly coverage
  workflow_dispatch:
    inputs:
      digest:
        description: "Force a digest email this run"
        type: boolean
        default: false

concurrency:
  group: finder
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pull RentHop data from the home runner
        run: |
          if git fetch origin renthop-data 2>/dev/null; then
            git show origin/renthop-data:data/renthop.json > data/renthop.json && echo "got home runner data"
          else
            echo "no home runner data yet"
          fi
      - name: Run finder
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ vars.RECIPIENT_EMAIL }}
          CC_EMAIL: ${{ vars.CC_EMAIL }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.digest }}" = "true" ]; then
            python -m finder.run --digest
          else
            python -m finder.run
          fi
      - name: Commit results
        run: |
          git config user.name "studio-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update listings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
