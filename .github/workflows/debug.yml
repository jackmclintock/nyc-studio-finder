name: Debug sources

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source names"
        default: "streeteasy zillow renthop apartments_com cityrealty leasebreak"
      urls:
        description: "Space-separated URLs (or 'streeteasy') for structural HTML analysis"
        default: ""

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch with full logging
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          if [ -n "${{ inputs.sources }}" ]; then python -m scripts.debug_fetch ${{ inputs.sources }}; fi
          if [ -n "${{ inputs.urls }}" ]; then python -m scripts.debug_html ${{ inputs.urls }}; fi
