name: Debug sources

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source names"
        default: "streeteasy zillow renthop apartments_com cityrealty leasebreak"
      urls:
        description: "Space-separated URLs (or 'streeteasy') for structural HTML analysis"
        default: ""
      queries:
        description: "Tavily search queries, one per line as query|domain"
        default: ""
      full_ldjson:
        description: "Print full ld+json blocks"
        default: ""

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch with full logging
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SOURCES: ${{ inputs.sources }}
          URLS: ${{ inputs.urls }}
          QUERIES: ${{ inputs.queries }}
          FULL_LDJSON: ${{ inputs.full_ldjson }}
        run: |
          if [ -n "$QUERIES" ]; then python -m scripts.debug_tavily; fi
          if [ -n "$SOURCES" ]; then python -m scripts.debug_fetch $SOURCES; fi
          if [ -n "$URLS" ]; then python -m scripts.debug_html $URLS; fi
